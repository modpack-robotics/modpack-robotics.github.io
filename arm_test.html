<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leader Arm Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0eeeb; font-family: Inter, system-ui, sans-serif; overflow: hidden; height: 100vh; }

  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* subtle radial vignette */
  #canvas-wrap::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(12,12,24,0.55) 100%);
  }

  /* ── variant switcher ── */
  #switcher {
    position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 0; border-radius: 100px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  .var-btn {
    padding: 11px 32px; border: none; border-radius: 100px;
    background: transparent; color: rgba(255,255,255,0.4);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    font-family: inherit; letter-spacing: 0.4px; white-space: nowrap;
  }
  .var-btn.active {
    background: #8C00FF; color: #fff;
    box-shadow: 0 0 20px rgba(140,0,255,0.3);
  }
  .var-btn:not(.active):hover { color: rgba(255,255,255,0.75); }

  /* ── top bar ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    background: linear-gradient(to bottom, rgba(26,28,38,0.9) 0%, transparent 100%);
    pointer-events: none;
  }
  #arm-title {
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
    transition: opacity 0.3s;
  }
  #arm-subtitle {
    font-size: 11px; color: rgba(140,0,255,0.9); font-weight: 500;
    letter-spacing: 0.5px; margin-top: 2px;
  }
  #hint {
    font-size: 11px; color: rgba(255,255,255,0.25); letter-spacing: 0.3px;
  }

  /* ── loading overlay ── */
  #loader {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #0c0c18;
    background: #f0eeeb; transition: opacity 0.5s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader-bar-wrap {
    width: 200px; height: 2px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden;
  }
  #loader-bar {
    height: 100%; width: 0%; background: #8C00FF; border-radius: 2px;
    transition: width 0.2s;
  }
  #loader-text { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; }
</style>
</head>
<body>

<div id="loader">
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
  <div id="loader-text">Loading…</div>
</div>

<div id="canvas-wrap"><canvas id="c"></canvas></div>

<div id="topbar">
  <div>
    <div id="arm-title">ARX Leader Arm</div>
    <div id="arm-subtitle">Leader Arm Variant</div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom</div>
</div>

<div id="switcher">
  <button class="var-btn active" data-variant="arx">ARX Leader</button>
  <button class="var-btn"        data-variant="rby1m">RB-Y1M Leader</button>
</div>

<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';

// ── renderer ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c26);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 50000);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 50;
controls.maxDistance = 12000;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// pause autorotate on interaction
canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; });

// ── lights ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const keyLight = new THREE.DirectionalLight(0xfff8f0, 4.5);
keyLight.position.set(2, 3, 2).normalize().multiplyScalar(800);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.radius = 2;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fill = new THREE.DirectionalLight(0xc8dcff, 1.5);
fill.position.set(-2, 0.5, -1).normalize().multiplyScalar(600);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x7722ff, 1.0);
rim.position.set(-0.5, -1, -2).normalize().multiplyScalar(500);
scene.add(rim);

// ── ground shadow plane ──────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10000, 10000),
  new THREE.ShadowMaterial({ opacity: 0.08 })   // much lighter shadow
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── materials ────────────────────────────────────────────────────────────────
const MAT = {
  pla: new THREE.MeshStandardMaterial({
    color: 0xf0f0f0, roughness: 0.65, metalness: 0.0,
    flatShading: true,
  }),
  motor: new THREE.MeshStandardMaterial({
    color: 0x1a1a1a, roughness: 0.3, metalness: 0.7,
    flatShading: true,
  }),
  metal: new THREE.MeshStandardMaterial({
    color: 0x888888, roughness: 0.2, metalness: 0.9,
    flatShading: true,
  }),
};

function getMat(name) {
  const n = (name || '').toLowerCase();
  if (n === 'motor' || n.includes('motor')) return MAT.motor;
  if (n === 'metal' || n.includes('metal')) return MAT.metal;
  return MAT.pla;  // 'pla' or anything else
}

// ── models ───────────────────────────────────────────────────────────────────
const MODELS = {
  arx: {
    url:      'models/arms/arx_arm.glb',
    title:    'ARX Leader Arm',
    subtitle: 'Leader Arm Variant',
    // Camera: from upper-right-front, arm lies along X so we look slightly along it
    cam: new THREE.Vector3(0.5, 0.6, 1.0),
  },
  rby1m: {
    url:      'models/arms/rby1m_arm.glb',
    title:    'RB-Y1M Leader Arm',
    subtitle: 'Leader Arm Variant',
    cam: new THREE.Vector3(-0.4, 0.7, 1.1),
  },
};

let active      = 'arx';
let busy        = false;
const loader    = new GLTFLoader();
const loaderBar = document.getElementById('loader-bar');
const loaderTxt = document.getElementById('loader-text');
const loaderEl  = document.getElementById('loader');

function setProgress(pct, msg) {
  loaderBar.style.width = pct + '%';
  loaderTxt.textContent = msg;
}

// ── load a variant ────────────────────────────────────────────────────────────
async function loadModel(key) {
  const m = MODELS[key];
  if (m.root) return m.root;

  const gltf = await new Promise((res, rej) =>
    loader.load(m.url, res,
      xhr => { if (xhr.total) setProgress(xhr.loaded / xhr.total * 100, `Loading ${m.title}…`); },
      rej)
  );

  // Apply materials and shadows
  gltf.scene.traverse(child => {
    if (!child.isMesh) return;
    child.material = getMat(child.name);
    child.castShadow = true;
    child.receiveShadow = true;
  });

  // STEP is Z-up → rotate -90° on X so it stands in Y-up Three.js space
  gltf.scene.rotation.x = -Math.PI / 2;

  const root = new THREE.Group();
  root.add(gltf.scene);
  scene.add(root);

  // Centre + scale to 600 scene units on longest axis
  const box    = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const scale  = 600 / Math.max(size.x, size.y, size.z);
  root.scale.setScalar(scale);

  const box2   = new THREE.Box3().setFromObject(root);
  const center2 = box2.getCenter(new THREE.Vector3());
  root.position.sub(center2);   // centre at world origin

  // Fit ground to bottom of model
  const box3 = new THREE.Box3().setFromObject(root);
  ground.position.y = box3.min.y - 1;
  // Fit shadow camera
  const maxDim = Math.max(...box3.getSize(new THREE.Vector3()).toArray());
  keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -maxDim * 0.8;
  keyLight.shadow.camera.right = keyLight.shadow.camera.top   =  maxDim * 0.8;
  keyLight.shadow.camera.far   = maxDim * 4;
  keyLight.shadow.camera.updateProjectionMatrix();

  root.visible = false;
  m.root = root;
  m.box  = box3;
  return root;
}

function placeCamera(key) {
  const m   = MODELS[key];
  const box = m.box;
  const center  = box.getCenter(new THREE.Vector3());
  const maxDim  = Math.max(...box.getSize(new THREE.Vector3()).toArray());
  const off     = m.cam.clone().normalize().multiplyScalar(maxDim * 1.7);

  controls.target.copy(center);
  camera.position.copy(center).add(off);
  camera.near = maxDim * 0.001;
  camera.far  = maxDim * 30;
  camera.updateProjectionMatrix();
  controls.update();
}

// ── opacity fade ─────────────────────────────────────────────────────────────
function setOpacity(root, op) {
  root.traverse(child => {
    if (!child.isMesh) return;
    child.material.transparent = op < 1;
    child.material.opacity = op;
    child.material.needsUpdate = true;
  });
}

function fadeIn(root, ms = 350) {
  return new Promise(resolve => {
    setOpacity(root, 0);
    root.visible = true;
    const t0 = performance.now();
    function tick() {
      const p = Math.min((performance.now() - t0) / ms, 1);
      setOpacity(root, p * p * (3 - 2 * p));   // smoothstep
      if (p < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
}

function fadeOut(root, ms = 250) {
  return new Promise(resolve => {
    const t0 = performance.now();
    function tick() {
      const p = Math.min((performance.now() - t0) / ms, 1);
      setOpacity(root, 1 - p * p * (3 - 2 * p));
      if (p < 1) requestAnimationFrame(tick);
      else { root.visible = false; setOpacity(root, 1); resolve(); }
    }
    requestAnimationFrame(tick);
  });
}

// ── switch variant ────────────────────────────────────────────────────────────
async function switchTo(key) {
  if (key === active || busy) return;
  busy = true;

  const prev   = MODELS[active].root;
  const m      = MODELS[key];

  loaderEl.style.opacity = '';
  loaderEl.classList.remove('hidden');
  setProgress(0, `Loading ${m.title}…`);

  let next;
  try { next = await loadModel(key); }
  catch (e) { loaderTxt.textContent = 'Load failed'; busy = false; return; }

  loaderEl.classList.add('hidden');

  if (prev) await fadeOut(prev, 250);
  placeCamera(key);
  controls.autoRotate = true;
  await fadeIn(next, 400);

  document.getElementById('arm-title').textContent    = m.title;
  document.getElementById('arm-subtitle').textContent = m.subtitle;
  active = key;
  busy   = false;
}

// ── switcher buttons ──────────────────────────────────────────────────────────
document.querySelectorAll('.var-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchTo(btn.dataset.variant);
  });
});

// ── boot ─────────────────────────────────────────────────────────────────────
(async () => {
  setProgress(0, 'Loading ARX Leader Arm…');
  try {
    const root = await loadModel('arx');
    loaderEl.classList.add('hidden');
    placeCamera('arx');
    await fadeIn(root, 500);
  } catch (e) {
    loaderTxt.textContent = 'Failed: ' + e.message;
    console.error(e);
  }
})();

// ── render loop ───────────────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}
(function render() {
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
